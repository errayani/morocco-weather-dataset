- name: Configure Kaggle credentials and push new version
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          rm -rf kaggle_upload
          mkdir -p kaggle_upload
          cp morocco_weather.csv kaggle_upload/

          cat <<EOF > kaggle_upload/dataset-metadata.json
          {
            "title": "Morocco Weather & 7-Day Forecast Dataset",
            "id": "${KAGGLE_USERNAME}/morocco-weather-forecast-dataset",
            "licenses": [
              {
                "name": "CC0-1.0"
              }
            ],
            "keywords": [
              "weather",
              "morocco",
              "meteorology",
              "forecast",
              "climate"
            ]
          }
          EOF

          if kaggle datasets status "${KAGGLE_USERNAME}/morocco-weather-forecast-dataset" >/dev/null 2>&1; then
            kaggle datasets version -p kaggle_upload -m "Daily automated update $(date -u +'%Y-%m-%d')"
          else
            kaggle datasets create -p kaggle_upload
          fi
