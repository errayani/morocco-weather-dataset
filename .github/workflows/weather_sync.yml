name: Sync Morocco Weather Dataset to Kaggle

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests six python-dateutil kaggle

      - name: Fetch and update Morocco weather data
        run: python fetch_weather.py

      - name: Commit updated CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco_weather.csv data/morocco_weather_history.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Morocco weather data $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Configure Kaggle credentials and push new version
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          rm -rf kaggle_upload
          mkdir -p kaggle_upload
          cp morocco_weather.csv kaggle_upload/

          cat <<EOF > kaggle_upload/dataset-metadata.json
          {
            "title": "Morocco Weather & 7-Day Forecast Dataset",
            "id": "${KAGGLE_USERNAME}/morocco-weather-forecast-dataset",
            "licenses": [
              {
                "name": "CC0-1.0"
              }
            ],
            "keywords": [
              "weather",
              "morocco",
              "meteorology",
              "forecast",
              "climate"
            ]
          }
          EOF

          if kaggle datasets status "${KAGGLE_USERNAME}/morocco-weather-forecast-dataset" >/dev/null 2>&1; then
            kaggle datasets version -p kaggle_upload -m "Daily automated update $(date -u +'%Y-%m-%d')"
          else
            kaggle datasets create -p kaggle_upload
          fi
